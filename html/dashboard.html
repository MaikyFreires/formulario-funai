<section id="consultorDashboard" class="dashboard-shell" hidden>
  <header class="dashboard-header">
    <img class="dashboard-logo" src="assets/funai-header.png" alt="FUNAI">
    <div>
      <span class="eyebrow">Area do consultor</span>
      <h1>Relatorios de reivindicacao</h1>
      <p id="dashboardEmail"></p>
    </div>
  </header>

  <div class="dashboard-actions" aria-label="Acoes do consultor">
    <button type="button" class="dashboard-action" id="newReportBtn">
      <strong>Novo formulario</strong>
      <span>Iniciar um formulario em branco.</span>
    </button>

    <button type="button" class="dashboard-action" id="draftReportsBtn">
      <strong>Meus rascunhos</strong>
      <span>Continuar relatorios salvos como rascunho.</span>
    </button>

    <button type="button" class="dashboard-action" id="sentReportsBtn">
      <strong>Enviados</strong>
      <span>Consultar formularios finalizados.</span>
    </button>
  </div>

  <section class="report-list-panel" id="reportListPanel" hidden>
    <div class="report-list-heading">
      <h2 id="reportListTitle">Relatorios</h2>
      <button type="button" class="ghost" id="closeReportListBtn">Fechar</button>
    </div>
    <div id="reportListMessage" class="message" role="status" aria-live="polite"></div>
    <div id="reportList" class="report-list"></div>
  </section>
</section>
