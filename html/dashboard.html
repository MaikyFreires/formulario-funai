<section id="consultorDashboard" class="dashboard-shell" hidden>
  <header class="dashboard-header">
    <img class="dashboard-logo" src="assets/funai-header.png" alt="FUNAI">
    <div>
      <span class="eyebrow">Área do consultor</span>
      <h1>Relatórios de reivindicação</h1>
      <p id="dashboardEmail"></p>
    </div>
  </header>

  <div id="dashboardMessage" class="message" role="status" aria-live="polite"></div>

  <div class="dashboard-actions" aria-label="Ações do consultor">
    <button type="button" class="dashboard-action" id="newReportBtn">
      <strong>Novo formulário</strong>
      <span>Iniciar um formulário em branco.</span>
    </button>

    <button type="button" class="dashboard-action" id="draftReportsBtn">
      <strong>Meus rascunhos</strong>
      <span>Continuar relatórios salvos como rascunho.</span>
    </button>

    <button type="button" class="dashboard-action" id="sentReportsBtn">
      <strong>Enviados</strong>
      <span>Consultar formulários finalizados.</span>
    </button>
  </div>

  <section class="report-list-panel" id="reportListPanel" hidden>
    <div class="report-list-heading">
      <h2 id="reportListTitle">Relatórios</h2>
      <button type="button" class="ghost" id="closeReportListBtn">Fechar</button>
    </div>
    <div class="report-list-controls" id="reportListControls" hidden>
      <label for="reportIdSearch">Pesquisar por ID da reivindicação</label>
      <input id="reportIdSearch" type="search" placeholder="Pesquisar por ID da reivindicação" autocomplete="off">
    </div>
    <div id="reportListMessage" class="message" role="status" aria-live="polite"></div>
    <div id="reportList" class="report-list"></div>
  </section>
</section>
