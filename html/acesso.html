<section id="accessGate" class="access-card">
        <div class="access-brand">
          <img src="assets/funai-header.png" alt="FUNAI">
          <div>
            <span class="eyebrow">Acesso restrito</span>
            <h1>Informe seu e-mail</h1>
            <p>Use o e-mail autorizado para acessar o formulário.</p>
          </div>
        </div>
        <form id="accessForm" class="access-form" novalidate>
          <label>
            E-mail do/a consultor/a
            <input id="accessEmail" name="accessEmail" type="email" placeholder="nome@exemplo.com" autocomplete="email" required>
          </label>
          <button id="accessSubmitBtn" type="submit">Acessar formulário</button>
        </form>
        <div id="accessMessage" class="message" role="status" aria-live="polite"></div>
      </section>
